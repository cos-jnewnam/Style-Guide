name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifest version
        run: |
          want="v$(jq -r .version extension/manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $want"
            exit 1
          fi
      - name: Build the zip
        run: |
          cp -r extension scottsdale-style-check
          zip -r "scottsdale-style-check-$GITHUB_REF_NAME.zip" scottsdale-style-check
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "scottsdale-style-check-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
